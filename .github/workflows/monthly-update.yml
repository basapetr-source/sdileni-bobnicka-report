name: Monthly Energy Sharing Report (Bobnická)

# NOT scheduled any more (2026-09-12). EDC drops TCP connections from GitHub's
# hosted runner IP ranges — DNS resolves, the handshake never completes — which
# killed the 12.9. run at login with UND_ERR_CONNECT_TIMEOUT. Verified from a
# runner that day: 20/20 connect attempts to sso/api/portal.edc-cr.cz timed out
# over 10 minutes, so fetchWithRetry cannot work around it either.
#
# The monthly job now runs locally on Petr's PC (Czech IP) via the Windows
# scheduled task SdileniBobnickaMonthly — see run-monthly-local.ps1. A
# self-hosted runner was deliberately NOT used here: this repo is public, and a
# runner on a public repo lets a fork's pull request execute code on that PC.
# For the same reason, do not add a pull_request trigger to this workflow.
#
# The manual trigger is kept as a probe: dispatch it to check whether EDC has
# lifted the block. If it passes, the cron lines can come back.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      # Only gates scheduled runs, so a manual re-run after a fix always executes.
      - name: Skip if previous month already processed
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Rucni spusteni - guard se neuplatnuje."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PREV_MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          DONE=true
          for GROUP in A B; do
            FILE="exports/Export-${GROUP}-${PREV_MONTH}-inout.csv"
            if [ ! -f "$FILE" ] || [ "$(grep -c '[^[:space:]]' "$FILE")" -lt 5 ]; then
              DONE=false
            fi
          done
          if [ "$DONE" = true ]; then
            echo "Mesic ${PREV_MONTH} jiz zpracovan pro obe skupiny. Preskakuji zbytek pipeline."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "Mesic ${PREV_MONTH} jeste nezpracovan, pokracuji."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Run monthly pipeline (export + report)
        if: steps.guard.outputs.should_run == 'true'
        env:
          EDC_USERNAME: ${{ secrets.EDC_USERNAME }}
          EDC_PASSWORD: ${{ secrets.EDC_PASSWORD }}
          SSE_ID_A: ${{ secrets.SSE_ID_A }}
          SSE_ID_B: ${{ secrets.SSE_ID_B }}
        run: node run-monthly.js

      - name: Copy report to docs/ for GitHub Pages
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p docs
          cp report.html docs/index.html

      - name: Commit and push outputs
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/ report.html docs/index.html
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Měsíční report $(date -u +'%Y-%m')"
            git push
          fi
